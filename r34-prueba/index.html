<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07111d"><title>R34 · Prueba visual</title><script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#f3f5f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:1000px;margin:auto;padding:14px 16px 18px}.top{display:flex;justify-content:space-between;align-items:start;gap:10px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#89a4bf}.title{font-size:20px;font-weight:700;margin-top:4px}.tag{font-size:10px;color:#b9c9d9;border:1px solid #ffffff25;padding:6px 9px;border-radius:99px;white-space:nowrap}.stage{position:relative;min-height:0;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 57%,#263647 0%,#111e2b 45%,#07111d 80%);margin:12px 0}.stage:after{content:"";position:absolute;left:12%;right:12%;bottom:14%;height:3px;background:#d8e9ff32;box-shadow:0 5px 32px 8px #a8d6ff17;pointer-events:none}model-viewer{width:100%;height:100%;--poster-color:transparent;background:transparent;--progress-bar-color:#8dc8ff;--progress-bar-height:2px}model-viewer::part(default-progress-bar){background:#4e6071}model-viewer::part(default-progress-mask){background:transparent}.loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#c7d4df;font-size:12px;letter-spacing:.08em}.bottom{display:flex;flex-direction:column;gap:9px}.hint{font-size:12px;color:#c2cfda;text-align:center}.controls{display:flex;justify-content:center;gap:9px}.btn{border:1px solid #ffffff35;background:#101c29;color:#f3f5f7;border-radius:11px;padding:11px 15px;font-size:12px;font-weight:650}.btn:active{transform:scale(.97);background:#253d53}.credit{font-size:9px;text-align:center;color:#8292a1;margin-top:1px}a{color:#a9d7ff}@media(min-width:700px){.wrap{padding:18px 24px}.title{font-size:23px}.stage{margin:16px 0}.hint{font-size:13px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">PROTOTIPO · SOLO EL AUTO</div><div class="title">Skyline GT‑R R34 V‑Spec II Nür</div></div><span class="tag">PRUEBA VISUAL</span></header><section class="stage"><div class="loading" id="loading">CARGANDO MODELO 3D…</div><model-viewer id="car" src="r34-nur.glb" alt="Nissan Skyline GT-R R34 V-Spec II Nür, modelo 3D" camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="1800" rotation-per-second="12deg" interaction-prompt="none" shadow-intensity="0" exposure="1.08" environment-image="neutral" min-camera-orbit="auto 30deg 3.2m" max-camera-orbit="auto 80deg 8m" camera-orbit="35deg 68deg 5.8m" field-of-view="32deg"></model-viewer></section><footer class="bottom"><div class="hint">Arrastra para girar el R34 y pellizca para acercar o alejar.</div><div class="controls"><button class="btn" id="spin">⏸ Pausar giro</button><button class="btn" id="reset">↻ Vista inicial</button></div><div class="credit">Modelo: OUTPISTON · Sketchfab · CC BY‑NC‑SA 4.0 (no comercial; atribución requerida).</div></footer></main><script>const m=document.querySelector('#car'),load=document.querySelector('#loading'),spin=document.querySelector('#spin');m.addEventListener('load',()=>load.style.display='none');m.addEventListener('error',()=>{load.textContent='No cargó el modelo. Comprueba tu conexión y vuelve a intentar.'});let rotating=true;spin.addEventListener('click',()=>{rotating=!rotating;m.autoRotate=rotating;spin.textContent=rotating?'⏸ Pausar giro':'▶ Girar auto'});document.querySelector('#reset').addEventListener('click',()=>{m.cameraOrbit='35deg 68deg 5.8m';m.fieldOfView='32deg';m.autoRotate=rotating});</script></body></html>
