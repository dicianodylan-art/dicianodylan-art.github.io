<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08111b"><title>R34 · Prueba de manejo</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111b;color:#f3f5f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}#view{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 8px #000}.title{font-size:15px;font-weight:750;letter-spacing:.02em}.sub{font-size:10px;color:#bacbda;margin-top:3px}.badge{border:1px solid #ffffff35;background:#07111bbd;border-radius:99px;padding:6px 9px;font-size:9px;letter-spacing:.12em}.top-actions{display:flex;align-items:center;gap:7px}.view-toggle{pointer-events:auto;border:1px solid #ffffff48;background:#101c2bdc;color:#fff;border-radius:10px;padding:7px 10px;font-size:10px;font-weight:700;white-space:nowrap;touch-action:manipulation}.status{position:absolute;top:76px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.08em;color:#d6e3ed;background:#07111bbb;border:1px solid #ffffff20;border-radius:99px;padding:7px 12px;white-space:nowrap}.status.err{color:#ffc4ba;border-color:#b7483a}.speed{position:absolute;right:16px;bottom:120px;width:86px;height:86px;border-radius:50%;background:#07111bd9;border:1px solid #ffffff45;display:grid;place-content:center;text-align:center;box-shadow:0 5px 24px #0006}.num{font-size:27px;font-variant-numeric:tabular-nums;font-weight:800;line-height:1}.unit{font-size:9px;color:#aebfd0;margin-top:3px;letter-spacing:.14em}.gear{font-size:10px;color:#bfe1ff;margin-top:3px}.hint{position:absolute;left:50%;bottom:94px;transform:translateX(-50%);font-size:10px;color:#eff5fa;background:#07111bad;padding:6px 9px;border-radius:99px;white-space:nowrap}.controls{position:absolute;bottom:16px;left:14px;right:14px;display:flex;align-items:end;justify-content:space-between;gap:8px;pointer-events:auto}.steer{display:flex;gap:8px}.pedals{display:flex;gap:8px}.btn{width:60px;height:58px;border:1px solid #ffffff52;border-radius:16px;background:#101c2bdc;color:white;font-size:22px;font-weight:800;box-shadow:0 4px 16px #0005;touch-action:none;user-select:none;-webkit-user-select:none}.btn.pedal{width:58px;height:68px;padding:8px;border-radius:13px;display:grid;place-items:center}.btn.pedal svg{width:100%;height:100%;fill:#d8dce1;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px #0008)}.btn.gas svg path:first-child{fill:#a9d8c0}.btn.brake svg path:first-child{fill:#e0b0b4}.btn.pedal svg path:not(:first-child){fill:none;stroke:#2b333b;stroke-width:2.6}.btn.gas{background:#154b37e6}.btn.brake{background:#682b30e6}.btn.down{transform:scale(.94);filter:brightness(1.3)}.credit{position:absolute;bottom:82px;right:15px;font-size:8px;color:#ffffff9c;text-align:right;max-width:210px}.loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#22364b,#08111b);font-size:12px;letter-spacing:.12em;color:#d8e3ee}.loading.err{color:#ffbfb5;text-align:center;padding:26px;line-height:1.5;letter-spacing:.03em}.hide{display:none!important}@media(min-width:700px){.controls{left:28px;right:28px;bottom:22px}.btn{width:66px;height:62px}.btn.pedal{width:62px;height:72px}.speed{right:28px;bottom:112px}.top{left:26px;right:26px}.title{font-size:17px}}</style></head><body><canvas id="view"></canvas><div class="loading" id="loading">CARGANDO EL NISSAN R34…</div><main class="hud"><header class="top"><div><div class="title">Nissan Skyline GT‑R R34 V‑Spec II Nür</div><div class="sub">Prueba de manejo · prototipo separado</div></div><div class="top-actions"><button class="view-toggle" id="viewToggle" type="button" aria-label="Cambiar entre cámara desde el asiento y cámara exterior" title="Cambiar vista de conducción">👁 PRIMERA PERSONA</button><div class="badge">R34 · DRIVE</div></div></header><div class="status" id="status">Preparando la pista…</div><div class="speed"><div class="num" id="speed">0</div><div class="unit">KM/H</div><div class="gear" id="gear">PUNTO MUERTO</div></div><div class="hint" id="hint">Acelera para salir · gira con ◀ ▶</div><div class="controls"><div class="steer"><button class="btn" data-control="left" aria-label="Girar a la izquierda">◀</button><button class="btn" data-control="right" aria-label="Girar a la derecha">▶</button></div><div class="pedals"><button class="btn pedal brake" data-control="brake" aria-label="Pedal de freno" title="Freno"><svg viewBox="0 0 48 64" aria-hidden="true"><path d="M12 6 Q12 2 17 2 H31 Q36 2 36 6 L42 58 Q42 62 37 62 H11 Q6 62 7 58 Z"/><path d="M13 20H35M14 29H36M15 38H37M16 47H38"/></svg></button><button class="btn pedal gas" data-control="gas" aria-label="Pedal del acelerador" title="Acelerador"><svg viewBox="0 0 48 64" aria-hidden="true"><path d="M17 4 Q17 1 22 1 H30 Q35 1 35 5 L40 59 Q40 62 36 62 H13 Q9 62 9 58 Z"/><path d="M16 18H35M16 28H36M17 38H37M17 48H38"/></svg></button></div></div><div class="credit">Modelo OUTPISTON · Sketchfab · CC BY‑NC‑SA 4.0 · No comercial</div></main><script type="module">
import * as THREE from './r34-three.module.js';
import { GLTFLoader } from './r34-GLTFLoader.module.js';
(()=>{'use strict';
const canvas=document.querySelector('#view'),loading=document.querySelector('#loading'),status=document.querySelector('#status'),speedEl=document.querySelector('#speed'),gearEl=document.querySelector('#gear'),hint=document.querySelector('#hint');
let scene,camera,renderer,car,clock,last=0,carYaw=0,speed=0,steer=0,gas=false,brake=false,keys={},roadMarks=[],worldReady=false,firstPerson=false,yawRate=0,bodyRoll=0,bodyPitch=0,verticalVelocity=0,suspensionHeight=.75;const viewToggle=document.querySelector('#viewToggle');
const roadCurve=[],ROAD_W=13,rx=120,rz=82;
function setStatus(s,bad=false){status.textContent=s;status.classList.toggle('err',bad)}
function makeRoad(){const grass=new THREE.Mesh(new THREE.PlaneGeometry(1400,1100),new THREE.MeshBasicMaterial({color:0x30452f}));grass.rotation.x=-Math.PI/2;grass.position.y=-.12;scene.add(grass);const ground=new THREE.Mesh(new THREE.PlaneGeometry(2400,2400),new THREE.MeshBasicMaterial({color:0x263a28}));ground.rotation.x=-Math.PI/2;ground.position.y=-.2;scene.add(ground);
 const N=128,positions=[],idx=[],dash=[];for(let i=0;i<=N;i++){let a=i/N*Math.PI*2;roadCurve.push(new THREE.Vector3(rx*Math.cos(a),0,rz*Math.sin(a)))}for(let i=0;i<N;i++){const a=i/N*Math.PI*2,b=(i+1)/N*Math.PI*2;let ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b);let p0=[rx*ca,0,rz*sa],p1=[rx*cb,0,rz*sb];let dx=p1[0]-p0[0],dz=p1[2]-p0[2],l=Math.hypot(dx,dz),nx=-dz/l, nz=dx/l,w=ROAD_W/2;let base=positions.length/3;positions.push(p0[0]+nx*w,.012,p0[2]+nz*w,p0[0]-nx*w,.012,p0[2]-nz*w,p1[0]+nx*w,.012,p1[2]+nz*w,p1[0]-nx*w,.012,p1[2]-nz*w);idx.push(base,base+2,base+1,base+1,base+2,base+3);if(i%16<6){let cx=(p0[0]+p1[0])/2,cz=(p0[2]+p1[2])/2;dash.push([cx,.026,cz,Math.atan2(dx,dz)])}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setIndex(idx);g.computeVertexNormals();scene.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x242a30,side:THREE.DoubleSide})));
 for(const [x,y,z,ang] of dash){const m=new THREE.Mesh(new THREE.BoxGeometry(.18,.018,2.1),new THREE.MeshBasicMaterial({color:0xe7e4d7}));m.position.set(x,y,z);m.rotation.y=ang;scene.add(m)}
 // low curbs at both road edges, broken into visible race-track blocks
 for(let side of [-1,1])for(let i=0;i<N;i+=8){let a=i/N*Math.PI*2,ang=a;let m=new THREE.Mesh(new THREE.BoxGeometry(.55,.12,.62),new THREE.MeshBasicMaterial({color:i%4===0?0xd64736:0xe7e7e4}));m.position.set((rx+side*(ROAD_W/2+.24))*Math.cos(a),.06,(rz+side*(ROAD_W/2+.24))*Math.sin(a));m.rotation.y=-Math.atan2(rz*Math.cos(a),-rx*Math.sin(a));scene.add(m)}
 // Trackside orange cones at several safe intervals
 for(let i=0;i<64;i+=8){let a=i/64*Math.PI*2;let c=new THREE.Mesh(new THREE.ConeGeometry(.32,.85,8),new THREE.MeshStandardMaterial({color:0xf07828,roughness:.68}));c.position.set((rx+ROAD_W/2+2)*Math.cos(a),.43,(rz+ROAD_W/2+2)*Math.sin(a));scene.add(c)}
}
function makeLights(){scene.add(new THREE.HemisphereLight(0xd9e8ff,0x38402b,.65));const sun=new THREE.DirectionalLight(0xfff2da,.85);sun.position.set(-80,130,45);scene.add(sun);const fill=new THREE.DirectionalLight(0xa9cbff,.2);fill.position.set(70,55,-90);scene.add(fill)}
function start(){scene=new THREE.Scene();scene.background=new THREE.Color(0x9dc9e8);scene.fog=new THREE.Fog(0x9dc9e8,180,520);camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,1000);renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,innerWidth<760?.55:.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;renderer.outputEncoding=THREE.sRGBEncoding;makeLights();makeRoad();
 setStatus('BAJANDO MODELO DEL AUTO…');let finished=false;const timer=setTimeout(()=>{if(!finished){loading.classList.add('err');loading.textContent='La carga del R34 tardó demasiado. Revisa conexión y vuelve a abrir la prueba.';setStatus('TIEMPO DE CARGA EXCEDIDO',true)}},45000);fetch('r34-nur-drive.glb?build=drive-v7').then(r=>{if(!r.ok)throw Error('No se pudo descargar el modelo: HTTP '+r.status);setStatus('LEYENDO ARCHIVO DEL R34…');return r.arrayBuffer()}).then(buf=>{setStatus('PREPARANDO AUTO 3D…');new GLTFLoader().parse(buf,'',g=>{finished=true;clearTimeout(timer);const model=g.scene;let box=new THREE.Box3().setFromObject(model),sz=box.getSize(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3()),scale=5.8/Math.max(sz.x,sz.y,sz.z);model.scale.setScalar(scale);model.position.copy(ctr).multiplyScalar(-scale);car=new THREE.Group();car.add(model);let grounded=new THREE.Box3().setFromObject(car);car.position.set(0,-grounded.min.y+.04,rz);suspensionHeight=car.position.y;scene.add(car);carYaw=-Math.PI/2;car.rotation.y=carYaw;worldReady=true;loading.classList.add('hide');setStatus('MOTOR LISTO · PISTA LIBRE');hint.textContent='Mantén GAS y usa ◀ ▶ para girar';setTimeout(()=>{hint.style.opacity='.5'},5000)},e=>{throw e})}).catch(e=>{finished=true;clearTimeout(timer);console.error('Fallo al cargar el GLB del R34',e);loading.classList.add('err');loading.textContent='No se pudo preparar el R34: '+(e&&e.message?e.message:String(e));setStatus('ERROR AL CARGAR EL R34',true)});
 window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,innerWidth<760?.55:.7));renderer.setSize(innerWidth,innerHeight)});bindControls();clock=new THREE.Clock();requestAnimationFrame(loop)}
function bindControls(){viewToggle.addEventListener('click',()=>{firstPerson=!firstPerson;viewToggle.textContent=firstPerson?'🚗 TERCERA PERSONA':'👁 PRIMERA PERSONA';camera.fov=firstPerson?65:52;camera.updateProjectionMatrix()});document.querySelectorAll('[data-control]').forEach(b=>{const c=b.dataset.control;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('down');if(c==='gas')gas=true;else if(c==='brake')brake=true;else if(c==='left')steer=-1;else steer=1});const up=e=>{e.preventDefault();b.classList.remove('down');if(c==='gas')gas=false;else if(c==='brake')brake=false;else if((c==='left'&&steer<0)||(c==='right'&&steer>0))steer=0};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()},{passive:false});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{keys={};gas=brake=false;steer=0})}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);if(!renderer||!scene)return;const throttle=gas||keys.ArrowUp||keys.KeyW,stopping=brake||keys.ArrowDown||keys.KeyS,left=steer<0||keys.ArrowLeft||keys.KeyA,right=steer>0||keys.ArrowRight||keys.KeyD;let steerAmt=(right?1:0)-(left?1:0);
 if(worldReady){if(throttle){if(speed<0)speed=Math.min(0,speed+17*dt);else speed=Math.min(48,speed+10*dt)}if(stopping){if(speed>0)speed=Math.max(0,speed-24*dt);else speed=Math.max(-8,speed-7*dt)}if(!throttle&&!stopping)speed*=Math.exp(-.20*dt);if(Math.abs(speed)<.03)speed=0;
 const oldSpeed=speed;const turnFactor=Math.min(1,Math.abs(speed)/5);const desiredYawRate=-steerAmt*.72*turnFactor*Math.sign(speed||1);yawRate+=(desiredYawRate-yawRate)*(1-Math.exp(-2.8*dt));carYaw+=yawRate*dt;car.position.x+=Math.sin(carYaw)*speed*dt;car.position.z+=Math.cos(carYaw)*speed*dt;const accel=(speed-oldSpeed)/Math.max(dt,.001);const targetPitch=Math.max(-.035,Math.min(.045,-accel*.0016));const targetRoll=Math.max(-.09,Math.min(.09,yawRate*Math.abs(speed)*.0018));bodyPitch+=(targetPitch-bodyPitch)*(1-Math.exp(-4.5*dt));bodyRoll+=(targetRoll-bodyRoll)*(1-Math.exp(-3.2*dt));verticalVelocity+=(-15*(car.position.y-suspensionHeight)-4.2*verticalVelocity)*dt;car.position.y+=verticalVelocity*dt;car.rotation.set(bodyPitch,carYaw,bodyRoll,'YXZ');
 let fx=Math.sin(carYaw),fz=Math.cos(carYaw);if(firstPerson){const eye=car.localToWorld(new THREE.Vector3(.34,1.02,-1.25));camera.position.lerp(eye,1-Math.exp(-12*dt));camera.fov=64;camera.updateProjectionMatrix();const aim=car.localToWorld(new THREE.Vector3(.34,.95,14));camera.lookAt(aim)}else{let camTarget=new THREE.Vector3(car.position.x-fx*10,car.position.y+5.1,car.position.z-fz*10);camera.position.lerp(camTarget,1-Math.exp(-5*dt));camera.fov=52;camera.updateProjectionMatrix();let look=new THREE.Vector3(car.position.x+fx*6,car.position.y+1.1,car.position.z+fz*6);camera.lookAt(look)}
 let km=Math.round(Math.abs(speed)*3.6);speedEl.textContent=km;gearEl.textContent=speed<-.1?'REVERSA':speed<.1?'LISTO':km<25?'1.ª MARCHA':km<55?'2.ª MARCHA':km<90?'3.ª MARCHA':km<125?'4.ª MARCHA':'5.ª MARCHA';if(Math.abs(car.position.x)>rx+50||Math.abs(car.position.z)>rz+50)setStatus('SIGUE LA PISTA O GIRA PARA VOLVER');else setStatus('MOTOR LISTO · PISTA LIBRE');}
 renderer.render(scene,camera)}
try{start()}catch(e){loading.classList.add('err');loading.textContent='Error al iniciar: '+(e&&e.stack?e.stack:(e&&e.message?e.message:String(e)));setStatus('ERROR DEL VISOR',true);console.error(e)}
})();
</script></main></body></html>
