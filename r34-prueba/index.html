<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08111b"><title>R34 · Prueba visual</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111b;color:#f3f5f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:1024px;margin:auto;padding:14px 16px 18px}.top{display:flex;justify-content:space-between;align-items:start;gap:10px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#89a4bf}.title{font-size:20px;font-weight:700;margin-top:4px}.tag{font-size:10px;color:#b9c9d9;border:1px solid #ffffff25;padding:6px 9px;border-radius:99px;white-space:nowrap}.stage{position:relative;min-height:0;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 52%,#263747 0%,#132130 49%,#08111b 86%);margin:12px 0;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#c7d4df;font-size:12px;letter-spacing:.08em;pointer-events:none}.loading.error{color:#ffc2b9;text-align:center;padding:24px}.bottom{display:flex;flex-direction:column;gap:9px}.hint{font-size:12px;color:#c2cfda;text-align:center}.controls{display:flex;justify-content:center;gap:9px}.btn{border:1px solid #ffffff35;background:#101c29;color:#f3f5f7;border-radius:11px;padding:11px 15px;font-size:12px;font-weight:650}.btn:active{background:#253d53}.credit{font-size:9px;text-align:center;color:#8292a1;margin-top:1px}@media(min-width:700px){.wrap{padding:18px 24px}.title{font-size:23px}.stage{margin:16px 0}.hint{font-size:13px}}</style><script src="r34-three.min.js"></script><script src="r34-GLTFLoader.js"></script></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">PROTOTIPO · SOLO EL AUTO</div><div class="title">Skyline GT‑R R34 V‑Spec II Nür</div></div><span class="tag">PRUEBA VISUAL</span></header><section class="stage" id="stage"><canvas id="view"></canvas><div class="loading" id="loading">CARGANDO EL R34…</div></section><footer class="bottom"><div class="hint">Arrastra para girarlo · rueda o pellizca para acercar</div><div class="controls"><button class="btn" id="spin">⏸ Pausar giro</button><button class="btn" id="reset">↻ Vista inicial</button></div><div class="credit">Modelo original: OUTPISTON · Sketchfab · CC BY‑NC‑SA 4.0; optimizado con menos polígonos (no comercial; atribución requerida).</div></footer></main><script>
(()=>{'use strict';const stage=document.querySelector('#stage'),canvas=document.querySelector('#view'),loading=document.querySelector('#loading'),spin=document.querySelector('#spin');let renderer,scene,camera,car,rotating=true,drag=null,yaw=.65,pitch=.2,distance=6.8,fit=1,needs=true;function setup(){scene=new THREE.Scene();scene.background=null;camera=new THREE.PerspectiveCamera(34,1,.01,100);renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,innerWidth<760?.8:1));renderer.outputEncoding=THREE.sRGBEncoding;renderer.setClearColor(0x000000,0);scene.add(new THREE.HemisphereLight(0xe1edff,0x28313d,2.1));const key=new THREE.DirectionalLight(0xfff3df,2.5);key.position.set(-4,7,6);scene.add(key);const fill=new THREE.DirectionalLight(0x9bc8ff,1.1);fill.position.set(4,3,-5);scene.add(fill);new THREE.GLTFLoader().load('r34-nur-laptop.glb',g=>{car=g.scene;scene.add(car);const box=new THREE.Box3().setFromObject(car),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());car.position.sub(center);let largest=Math.max(size.x,size.y,size.z);fit=4.5/largest;car.scale.setScalar(fit);camera.position.set(0,2.15,7);camera.lookAt(0,0,0);resize();loading.style.display='none';needs=true},undefined,e=>{loading.className='loading error';loading.textContent='No se pudo cargar el modelo 3D. Recarga la página y revisa tu conexión.';console.error(e)});resize();animate()}function resize(){if(!renderer)return;let w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();needs=true}function aim(){if(!car)return;let r=distance;camera.position.set(Math.sin(yaw)*Math.cos(pitch)*r,Math.sin(pitch)*r+0.05,Math.cos(yaw)*Math.cos(pitch)*r);camera.lookAt(0,0,0);needs=true}function animate(){requestAnimationFrame(animate);if(rotating&&car){yaw+=.0028;aim()}if(needs){renderer.render(scene,camera);needs=false}}spin.addEventListener('click',()=>{rotating=!rotating;spin.textContent=rotating?'⏸ Pausar giro':'▶ Girar auto'});document.querySelector('#reset').addEventListener('click',()=>{yaw=.65;pitch=.2;distance=6.8;aim()});stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,id:e.pointerId};stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;yaw-=dx*.008;pitch=Math.max(-.3,Math.min(.75,pitch+dy*.005));rotating=false;spin.textContent='▶ Girar auto';aim()});stage.addEventListener('pointerup',()=>drag=null);stage.addEventListener('wheel',e=>{distance=Math.max(4.2,Math.min(11,distance+e.deltaY*.008));aim();e.preventDefault()},{passive:false});let pinch=null;stage.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});stage.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){let n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);distance=Math.max(4.2,Math.min(11,distance+(pinch-n)*.015));pinch=n;aim();e.preventDefault()}},{passive:false});stage.addEventListener('touchend',()=>pinch=null);window.addEventListener('resize',resize);setup()})();
</script></body></html>
